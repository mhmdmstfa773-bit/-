<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لج فقط</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }
        .container { padding: 20px; width: 90%; max-width: 400px; }
        h1 { color: #ff4d6d; font-size: 22px; margin-bottom: 30px; line-height: 1.5; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        button {
            padding: 15px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: #ff4d6d;
            color: white;
            transition: 0.3s;
        }
        button.secondary { background-color: #ff85a1; }
        
        /* الألبوم */
        #album { display: none; width: 100%; padding: 20px 0; }
        .photo-frame {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
            margin-bottom: 20px;
            padding: 10px;
        }
        .photo-frame img {
            width: 90%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .photo-frame.show { opacity: 1; transform: translateY(0); }
        
        .final-link {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            color: #ff4d6d;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.2);
        }
    </style>
</head>
<body>

    <!-- الاستبيان -->
    <div id="survey" class="container">
        <div id="q1">
            <h1>تعرفين شنو سبب تواجدج هنا؟</h1>
            <div class="btn-group">
                <button onclick="nextStep('q1', 'q2')">إي أعرف</button>
                <button class="secondary" onclick="nextStep('q1', 'q2')">لا ما عندي فكرة</button>
            </div>
        </div>

        <div id="q2" style="display:none;">
            <h1>أكو واحد نسى عيد ميلادج، تعرفيه؟</h1>
            <div class="btn-group">
                <button onclick="nextStep('q2', 'q3')">إي أعرفه</button>
                <button class="secondary" onclick="nextStep('q2', 'q3')">إي طبعاً ماكو حيوان غيره</button>
            </div>
        </div>

        <div id="q3" style="display:none;">
            <h1>هم ناوية تسامحينه؟</h1>
            <div class="btn-group">
                <button onclick="startAlbum()">إي مو مشكلة</button>
                <button class="secondary" onclick="showRetry()">لا خل يولي</button>
            </div>
        </div>

        <div id="retry" style="display:none;">
            <h1>همممم... راح أحاول وياج</h1>
            <div class="btn-group">
                <button onclick="startAlbum()">يلا خل أشوف</button>
                <button class="secondary" onclick="startAlbum()">لا تحاول</button>
            </div>
        </div>
    </div>

    <!-- الألبوم -->
    <div id="album">
        <h1 id="albumTitle">لحظاتنا سوا.. ❤️</h1>
        
        <!-- كرر هذا القسم لكل صورة -->
        <div class="photo-frame"><img src="https://ibb.co/rGfFngLY.jpg"></div>
        <div class="photo-frame"><img src="رابط_صورتكم_2.jpg"></div>
        <div class="photo-frame"><img src="رابط_صورتكم_3.jpg"></div>
        
        <p style="padding: 20px; color: #590d22;">باقي شي واحد أخير لازم تشوفيه..</p>
        <a href="رابط_موقع_GitHub_الذي_صنعناه_سابقاً" class="final-link" id="finalBtn">اضغطي هنا 💌</a>
    </div>

    <script>
        function nextStep(current, next) {
            document.getElementById(current).style.display = 'none';
            document.getElementById(next).style.display = 'block';
        }

        function showRetry() {
            document.getElementById('q3').style.display = 'none';
            document.getElementById('retry').style.display = 'block';
        }

        function startAlbum() {
            document.getElementById('survey').style.display = 'none';
            document.getElementById('album').style.display = 'block';
            
            // إظهار الصور بشكل تدريجي عند التمرير
            const frames = document.querySelectorAll('.photo-frame');
            frames.forEach((frame, index) => {
                setTimeout(() => {
                    frame.classList.add('show');
                    if(index === frames.length - 1) {
                        setTimeout(() => {
                            document.getElementById('finalBtn').style.display = 'inline-block';
                        }, 1500);
                    }
                }, index * 1500); // تظهر صورة كل ثانية ونصف
            });
        }
    </script>
</body>
</html>
